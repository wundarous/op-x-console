<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Ship orientation schematic</title><desc id="desc">The Stacks surround an interior containing adjacent Bridge and Transfer Chamber. Room diagrams show functions rather than exact geometry. Robots remain outside the two inner rooms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547b70"/></marker></defs><rect width="100%" height="100%" fill="#f7f4eb"/><g font-family="DejaVu Sans, sans-serif"><text x="50" y="48" font-size="17" fill="#547b70" font-weight="bold">A-HAVA / SHIP TOUR REFERENCE</text><text x="50" y="96" font-size="36" fill="#203b43" font-weight="bold">Three spaces. Different functions.</text><text x="50" y="130" font-size="18" fill="#203b43" font-weight="normal">Orientation schematic • principal spaces, not a measured floor plan</text><circle cx="445" cy="450" r="270" fill="#e4ede6" stroke="#91a99c" stroke-width="3"/><circle cx="445" cy="450" r="165" fill="#f7f4eb" stroke="#91a99c" stroke-width="2"/><text x="375" y="224" font-size="23" fill="#203b43" font-weight="bold">THE STACKS</text><text x="303" y="253" font-size="16" fill="#203b43" font-weight="normal">Approximately nine million pods</text><path d="M 650.0 450.0 L 692.0 450.0" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 643.014794389259 503.05790424601673 L 683.5836790933998 513.9283041403227" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 622.5352077758099 552.5 L 658.9082747347563 573.5" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 589.9568901432423 594.9568901432422 L 619.6553749530773 624.6553749530772" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 547.5 627.5352077758099 L 568.5 663.9082747347563" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 498.05790424601673 648.014794389259 L 508.9283041403226 688.5836790933998" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 445.0 655.0 L 445.0 697.0" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 391.9420957539832 648.014794389259 L 381.07169585967733 688.5836790933998" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 342.50000000000006 627.5352077758099 L 321.50000000000006 663.9082747347563" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 300.0431098567578 594.9568901432423 L 270.3446250469228 624.6553749530773" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 267.4647922241901 552.5 L 231.09172526524364 573.5" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 246.98520561074102 503.0579042460168 L 206.41632090660016 513.9283041403227" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 240.0 450.0 L 198.0 450.00000000000006" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 246.985205610741 396.94209575398327 L 206.41632090660013 386.07169585967733" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 267.4647922241901 347.5 L 231.09172526524367 326.5" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 300.0431098567577 305.0431098567578 L 270.3446250469227 275.3446250469228" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 589.9568901432422 305.0431098567577 L 619.6553749530772 275.3446250469227" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 622.5352077758099 347.4999999999999 L 658.9082747347563 326.4999999999999" fill="none" stroke="#b2c4b6" stroke-width="4"/><path d="M 643.014794389259 396.94209575398327 L 683.5836790933998 386.0716958596774" fill="none" stroke="#b2c4b6" stroke-width="4"/><rect x="306" y="328" width="280" height="105" rx="10" fill="#f4e4db" stroke="#b57a65" stroke-width="2"/><text x="324" y="358" font-size="19" fill="#934533" font-weight="bold">BRIDGE</text><text x="324" y="385" font-size="16" fill="#934533" font-weight="normal">Artifact podium</text><text x="324" y="408" font-size="16" fill="#934533" font-weight="normal">Ship interface</text><rect x="306" y="457" width="280" height="114" rx="10" fill="#f4e4db" stroke="#b57a65" stroke-width="2"/><text x="324" y="487" font-size="19" fill="#934533" font-weight="bold">TRANSFER CHAMBER</text><text x="324" y="514" font-size="16" fill="#934533" font-weight="normal">One ship pod</text><text x="324" y="537" font-size="16" fill="#934533" font-weight="normal">Artifact on transfer podium</text><path d="M 445 433 L 445 457" fill="none" stroke="#934533" stroke-width="4"/><text x="315" y="625" font-size="18" fill="#203b43" font-weight="normal">Bodies remain in stasis</text><text x="302" y="650" font-size="16" fill="#203b43" font-weight="normal">Essences reside in the Artifact</text><rect x="835" y="207" width="495" height="130" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="853" y="237" font-size="19" fill="#203b43" font-weight="bold">01 / THE STACKS</text><text x="853" y="264" font-size="16" fill="#203b43" font-weight="normal">Circular pod chamber surrounding the interior.</text><text x="853" y="287" font-size="16" fill="#203b43" font-weight="normal">Body storage, not A-HAVA training.</text><text x="853" y="310" font-size="16" fill="#203b43" font-weight="normal">Entry only with permission.</text><rect x="835" y="363" width="495" height="130" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="853" y="393" font-size="19" fill="#203b43" font-weight="bold">02 / BRIDGE</text><text x="853" y="420" font-size="16" fill="#203b43" font-weight="normal">Adjacent to the Transfer Chamber.</text><text x="853" y="443" font-size="16" fill="#203b43" font-weight="normal">The Artifact interfaces with the ship here.</text><text x="853" y="466" font-size="16" fill="#203b43" font-weight="normal">No familiar controls or operator desks.</text><rect x="835" y="519" width="495" height="130" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="853" y="549" font-size="19" fill="#203b43" font-weight="bold">03 / TRANSFER CHAMBER</text><text x="853" y="576" font-size="16" fill="#203b43" font-weight="normal">The ship pod and Artifact enable transfer.</text><text x="853" y="599" font-size="16" fill="#203b43" font-weight="normal">Different from campus refresh and training pods.</text><text x="853" y="622" font-size="16" fill="#203b43" font-weight="normal">Transfers are performed by humans.</text><path d="M 50 754 L 1350 754" fill="none" stroke="#c7d0c4" stroke-width="4"/><text x="50" y="796" font-size="18" fill="#934533" font-weight="bold">ACCESS</text><text x="50" y="830" font-size="20" fill="#203b43" font-weight="normal">Escorted orientation or scheduled ascension duty only.</text><text x="50" y="861" font-size="16" fill="#203b43" font-weight="normal">Security bots guard outside the Bridge and Transfer Chamber. Robots do not enter either room or approach the Artifact.</text></g></svg>