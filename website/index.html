<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Read the recovered journal.">
    <title>Recovered journal</title>
    <script type="module" crossorigin src="/op-x-console/assets/index-obYtyrvI.js"></script>
    <link rel="stylesheet" crossorigin href="/op-x-console/assets/index-CREMa2eO.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to story</a>
    <header class="masthead">
      <a class="wordmark" href="#" aria-label="Journal — home">JOURNAL</a>
      <nav class="mode-navigation" aria-label="Reading mode">
        <button id="mode-toggle" class="archive-label" type="button" aria-expanded="false" aria-controls="mode-menu"><i aria-hidden="true"></i><span id="mode-label">Recovered journal</span><span aria-hidden="true">⌄</span></button>
        <div id="mode-menu" class="mode-menu" hidden><a id="journal-mode" href="#">Recovered journal</a><a href="#archive">Document archive</a></div>
      </nav>
    </header>
    <p id="storage-notice" class="notice" role="status" hidden></p>
    <main id="main" tabindex="-1" aria-busy="true">
      <p class="loading">Opening the journal…</p>
    </main>
    <dialog id="document-dialog" aria-labelledby="document-title">
      <header class="dialog-header"><span class="eyebrow">Document archive</span><button id="document-close" type="button" aria-label="Close document">×</button></header>
      <p id="document-id" class="meta"></p><h2 id="document-title" class="reader-title"></h2><div id="document-body" class="body"></div>
    </dialog>
    <footer class="site-footer"><span id="publication-title">Recovered journal</span><span>Recovered records</span></footer>
  </body>
</html>
