<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1640" viewBox="0 0 1400 1640" role="img" aria-labelledby="title desc">
<title id="title">Institute grounds — visitor map</title>
<desc id="desc">Exterior wayfinding map. An oval central lobby sits in front of a rectangular activities building. Four wings form an X: dormitories upper right, agent HAVAs upper left nearest the ship path, systems and maintenance lower left, and library, nurses’ station and entertainment lower right. South is at the top. Evelyn’s statue and garden are below the lobby. Walking paths surround the institute; the ship path leaves at upper left and the farmland and cultivation path leaves at lower right. Numbered circles match the destination key.</desc>
