<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc"><title id="title">A-HAVA campus overview and lobby wayfinding</title><desc id="desc">A conceptual overhead campus map with a separate lobby sign diagram. Agent quarters, ship and service buildings are restricted. Library, archive, fitness, sports arena, pub and gardens serve the campus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547b70"/></marker></defs><rect width="100%" height="100%" fill="#f7f4eb"/><g font-family="DejaVu Sans, sans-serif"><text x="50" y="48" font-size="17" fill="#547b70" font-weight="bold">A-HAVA / CAMPUS ORIENTATION</text><text x="50" y="95" font-size="38" fill="#203b43" font-weight="bold">Find your way around</text><text x="50" y="128" font-size="18" fill="#203b43" font-weight="normal">Central campus overview • destinations and access, not a measured site plan</text><text x="50" y="180" font-size="18" fill="#203b43" font-weight="bold">01 / CAMPUS OVERVIEW</text><path d="M 775 235 L 775 382" fill="none" stroke="#547b70" stroke-width="4"/><path d="M 775 425 L 450 425" fill="none" stroke="#547b70" stroke-width="4"/><path d="M 775 425 L 1080 425" fill="none" stroke="#547b70" stroke-width="4"/><path d="M 775 465 L 775 625" fill="none" stroke="#547b70" stroke-width="4"/><path d="M 450 290 L 450 625" fill="none" stroke="#547b70" stroke-width="4"/><path d="M 1080 290 L 1080 625" fill="none" stroke="#547b70" stroke-width="4"/><path d="M 205 295 Q 95 450 200 620 L 1290 620 Q 1480 450 1365 295" fill="none" stroke="#83956c" stroke-width="4" stroke-dasharray="9 8"/><rect x="640" y="195" width="270" height="80" rx="10" fill="#f4e4db" stroke="#b57a65" stroke-width="2"/><text x="658" y="225" font-size="19" fill="#934533" font-weight="bold">SHIP</text><text x="658" y="252" font-size="16" fill="#934533" font-weight="normal">Escorted / scheduled access</text><rect x="85" y="220" width="290" height="100" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="103" y="250" font-size="19" fill="#203b43" font-weight="bold">Library + Archive</text><text x="103" y="277" font-size="16" fill="#203b43" font-weight="normal">Reading and study rooms</text><text x="103" y="300" font-size="16" fill="#203b43" font-weight="normal">Archivist desk / records</text><rect x="390" y="220" width="220" height="100" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="408" y="250" font-size="19" fill="#203b43" font-weight="bold">Cafeteria</text><text x="408" y="277" font-size="16" fill="#203b43" font-weight="normal">Dining + kitchens</text><rect x="960" y="220" width="265" height="100" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="978" y="250" font-size="19" fill="#203b43" font-weight="bold">Care Centre</text><text x="978" y="277" font-size="16" fill="#203b43" font-weight="normal">Nurses / refresh pods</text><text x="978" y="300" font-size="16" fill="#203b43" font-weight="normal">Secured wired interfaces</text><rect x="1250" y="220" width="275" height="100" rx="10" fill="#f4e4db" stroke="#b57a65" stroke-width="2"/><text x="1268" y="250" font-size="19" fill="#934533" font-weight="bold">Service buildings</text><text x="1268" y="277" font-size="16" fill="#934533" font-weight="normal">Robot maintenance</text><text x="1268" y="300" font-size="16" fill="#934533" font-weight="normal">Service access only</text><rect x="140" y="370" width="275" height="105" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="158" y="400" font-size="19" fill="#203b43" font-weight="bold">Residential quarters</text><text x="158" y="427" font-size="16" fill="#203b43" font-weight="normal">Operator accommodation</text><text x="158" y="450" font-size="16" fill="#203b43" font-weight="normal">Resident common rooms</text><rect x="560" y="375" width="400" height="100" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="578" y="405" font-size="19" fill="#203b43" font-weight="bold">CENTRAL LOBBY</text><text x="578" y="432" font-size="16" fill="#203b43" font-weight="normal">Campus information / meeting point</text><text x="578" y="455" font-size="16" fill="#203b43" font-weight="normal">See wayfinding panel below</text><rect x="1120" y="370" width="360" height="105" rx="10" fill="#f4e4db" stroke="#b57a65" stroke-width="2"/><text x="1138" y="400" font-size="19" fill="#934533" font-weight="bold">EAST WING / AGENT QUARTERS</text><text x="1138" y="427" font-size="16" fill="#934533" font-weight="normal">No operator entry</text><text x="1138" y="450" font-size="16" fill="#934533" font-weight="normal">Care and training pods</text><rect x="165" y="510" width="270" height="90" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="183" y="540" font-size="19" fill="#203b43" font-weight="bold">Fitness + Sports Arena</text><text x="183" y="567" font-size="16" fill="#203b43" font-weight="normal">Exercise / courts / seating</text><rect x="465" y="510" width="270" height="90" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="483" y="540" font-size="19" fill="#203b43" font-weight="bold">Pub + Recreation</text><text x="483" y="567" font-size="16" fill="#203b43" font-weight="normal">Social rooms / gathering space</text><rect x="765" y="510" width="270" height="90" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="783" y="540" font-size="19" fill="#203b43" font-weight="bold">Gardens + Courtyard</text><text x="783" y="567" font-size="16" fill="#203b43" font-weight="normal">Evelyn memorial plaza</text><rect x="1065" y="510" width="320" height="90" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="1083" y="540" font-size="19" fill="#203b43" font-weight="bold">Assembly + Learning</text><text x="1083" y="567" font-size="16" fill="#203b43" font-weight="normal">Hall / classrooms / workshops</text><text x="180" y="662" font-size="16" fill="#547b70" font-weight="bold">OUTDOOR WALKING LOOP</text><text x="670" y="662" font-size="16" fill="#203b43" font-weight="normal">Cultivated grounds beyond the loop • remain on permitted paths</text><path d="M 50 697 L 1550 697" fill="none" stroke="#c7d0c4" stroke-width="4"/><text x="50" y="740" font-size="18" fill="#203b43" font-weight="bold">02 / AT THE CENTRAL LOBBY</text><text x="50" y="767" font-size="17" fill="#203b43" font-weight="normal">Follow destination signs. East Wing and ship access require authorization.</text><rect x="590" y="890" width="390" height="76" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="608" y="920" font-size="19" fill="#203b43" font-weight="bold">YOU ARE HERE</text><text x="608" y="947" font-size="16" fill="#203b43" font-weight="normal">Central lobby</text><path d="M 590 928 L 475 928" fill="none" stroke="#547b70" stroke-width="4" marker-end="url(#arrow)"/><path d="M 785 890 L 785 836" fill="none" stroke="#547b70" stroke-width="4" marker-end="url(#arrow)"/><path d="M 980 928 L 1095 928" fill="none" stroke="#547b70" stroke-width="4" marker-end="url(#arrow)"/><path d="M 785 966 L 785 1021" fill="none" stroke="#547b70" stroke-width="4" marker-end="url(#arrow)"/><rect x="90" y="870" width="385" height="110" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="108" y="900" font-size="19" fill="#203b43" font-weight="bold">Library / Archive</text><text x="108" y="927" font-size="16" fill="#203b43" font-weight="normal">Cafeteria</text><text x="108" y="950" font-size="16" fill="#203b43" font-weight="normal">Residential quarters</text><rect x="585" y="789" width="400" height="47" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="603" y="819" font-size="19" fill="#203b43" font-weight="bold">Evelyn plaza / Ship approach</text><rect x="1095" y="870" width="405" height="110" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="1113" y="900" font-size="19" fill="#203b43" font-weight="bold">Care Centre</text><text x="1113" y="927" font-size="16" fill="#203b43" font-weight="normal">Refresh / nurses</text><text x="1113" y="950" font-size="16" fill="#203b43" font-weight="normal">East Wing boundary — no entry</text><rect x="480" y="1025" width="610" height="47" rx="10" fill="#e4ede6" stroke="#91a99c" stroke-width="2"/><text x="498" y="1055" font-size="19" fill="#203b43" font-weight="bold">Fitness / Arena / Pub / Gardens / Walking paths</text><text x="50" y="1127" font-size="16" fill="#203b43" font-weight="normal">Solid lines: campus connections     Dashed line: walking loop     Rust panels: restricted destinations</text></g></svg>